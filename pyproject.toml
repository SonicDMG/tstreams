[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tstreams"
version = "0.1.0"
description = "Task coordination layer for multi-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
toml = ["tomli>=2.0"]   # only needed on Python < 3.11

[tool.uv]
dev-dependencies = []

[project.scripts]
ts = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["dashboard/index.html"]

[tool.setuptools]
py-modules = ["api", "cli", "db", "github", "models"]
